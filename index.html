<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUBIRA COMERCIAL</title>
  <link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-light: #ecfdf5;
      --primary-dark: #0d5c55;
      --accent: #0f766e;
      --bg: #f3f4f6;
      --bg-card: #ffffff;
      --bg-card2: #f9fafb;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --warning: #b45309;
      --danger: #dc2626;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --sidebar-w: 265px;
      --sidebar-bg: #111827;
      --sidebar-bg-hover: #1f2937;
      --sidebar-text: #9ca3af;
      --sidebar-text-active: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      transition: transform .3s;
    }
    .sidebar-logo {
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-logo img { width: 46px; height: 46px; object-fit: contain; border-radius: 10px; }
    .sidebar-logo .brand { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1.5px; }
    .sidebar-logo .sub   { font-size: 10px; color: var(--sidebar-text); letter-spacing: .8px; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-section { padding: 14px 18px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #4b5563; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px; margin: 0 10px 2px; border-radius: 8px;
      cursor: pointer; color: var(--sidebar-text); font-size: 14px;
      border-left: 3px solid transparent; transition: all .2s;
    }
    .nav-item:hover { background: var(--sidebar-bg-hover); color: var(--sidebar-text-active); }
    .nav-item.active { background: var(--primary); color: #fff; border-left-color: var(--primary); }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: var(--sidebar-text); }
    .sidebar-footer-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .sidebar-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary-dark);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .sf-user-name { font-size: 13px; font-weight: 600; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sf-user-role { font-size: 11px; color: var(--sidebar-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-logout-btn {
      flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      color: #e5e7eb; border-radius: 8px; padding: 8px; font-size: 11px; cursor: pointer; transition: background .2s;
    }
    .sidebar-logout-btn:hover { background: rgba(255,255,255,.12); }
    .btn-link { flex: none; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-link:hover { background: var(--primary-dark); }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--success);
      display: inline-block; position: relative;
    }
    .pulse-dot::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--success);
      animation: pulseAnim 1.6s ease-out infinite;
    }
    @keyframes pulseAnim { from{opacity:1;transform:scale(1)} to{opacity:0;transform:scale(2.2)} }
    .mob-overlay { display: none; }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 28px; height: 64px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50;
    }
    .topbar-left h1 { font-size: 18px; font-weight: 600; }
    .topbar-left p  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .hamburger { display: none; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); cursor: pointer; font-size: 16px; }

    /* ── CONTENT ── */
    .content { padding: 28px; flex: 1; }
    .page { display: none; }
    .page.active { display: block; }

    /* ── STATS GRID ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px;
      display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); transition: transform .2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .stat-info .num   { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-info .label { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* ── CARD ── */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .b-pending       { background:rgba(107,114,128,.14); color:#6b7280; }
    .b-active        { background:rgba(16,185,129,.14);  color:var(--success); }
    .b-paused        { background:rgba(245,158,11,.14);  color:var(--warning); }
    .b-finished_by_ti{ background:rgba(59,130,246,.14);  color:var(--info); }
    .b-completed     { background:rgba(15,118,110,.14);  color:var(--primary); }
    .b-cancelled     { background:rgba(239,68,68,.14);   color:var(--danger); }
    .b-web        { background:rgba(59,130,246,.14);  color:var(--info); }
    .b-mobile     { background:rgba(139,92,246,.14);  color:var(--purple); }
    .b-desktop    { background:rgba(16,185,129,.14);  color:var(--success); }
    .b-family     { background:rgba(236,72,153,.14);  color:#db2777; }
    .b-venta          { background:rgba(15,118,110,.14); color:var(--primary); }
    .b-alquiler       { background:rgba(245,158,11,.14); color:var(--warning); }
    .b-venta_alquiler { background:rgba(59,130,246,.14); color:var(--info); }

    /* ── PRODUCT GRID ── */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; transition: transform .2s, box-shadow .2s; }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .product-head { display: flex; gap: 12px; align-items: center; }
    .product-logo { width: 48px; height: 48px; border-radius: 10px; object-fit: contain; background: var(--bg-card2); border: 1px solid var(--border); flex-shrink: 0; }
    .product-logo-ph { width: 48px; height: 48px; border-radius: 10px; background: var(--primary-light); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .product-name { font-size: 15px; font-weight: 700; }
    .product-code { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .product-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-height: 60px; overflow: hidden; }
    .product-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .progress-wrap { display: flex; align-items: center; gap: 10px; }
    .product-price-row { margin-top: -4px; }
    .progress-bar-bg { flex: 1; height: 8px; border-radius: 6px; background: var(--border); overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), #14b8a6); }
    .progress-pct { font-size: 12px; font-weight: 700; color: var(--primary); min-width: 34px; text-align: right; }
    .product-offer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
    .product-price { font-size: 19px; font-weight: 800; color: var(--primary); letter-spacing: -.01em; }
    .product-notes { font-size: 12px; color: var(--text-muted); background: var(--bg-card2); border-radius: 8px; padding: 8px 10px; line-height: 1.4; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .icon { width: 36px; height: 36px; margin-bottom: 14px; opacity: .4; }

    /* ── DASHBOARD GREETING ── */
    .greeting h1 { font-size: 23px; font-weight: 800; letter-spacing: -.01em; }
    .greeting p { color: var(--text-muted); font-size: 13px; margin-top: 3px; }

    /* ── AGENDA WIDGET (dashboard) ── */
    .agenda-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; transition: background .15s; }
    .agenda-item:hover { background: var(--bg-card2); }
    .agenda-item + .agenda-item { margin-top: 2px; }
    .agenda-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .agenda-time { font-size: 11px; font-weight: 700; color: var(--primary); white-space: nowrap; }
    .agenda-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .agenda-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }

    /* ── CATALOG FILTER BAR ── */
    .cat-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .cat-filters input, .cat-filters select { width: auto; min-width: 170px; }
    .cat-search { position: relative; flex: 1; min-width: 220px; }
    .cat-search .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .cat-search input { padding-left: 38px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 500; transition: all .2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    /* ── FORM ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--text); font-size: 14px; outline: none;
      width: 100%; transition: border-color .2s, box-shadow .2s; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--primary-light);
    }
    textarea { resize: vertical; min-height: 70px; }

    /* ── FILTERS / TABS (calendario) ── */
    .filters-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .filters-bar input, .filters-bar select { width: auto; min-width: 150px; }
    .cal-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .cal-tab {
      background: none; border: none; cursor: pointer;
      padding: 10px 16px; font-size: 13.5px; font-weight: 500;
      color: var(--text-muted); border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color .2s, border-color .2s;
    }
    .cal-tab:hover { color: var(--text); }
    .cal-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(17,24,39,.55); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      width: 100%; max-width: 780px; max-height: 92vh; overflow-y: auto;
      box-shadow: var(--shadow-md); transform: scale(.96); transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header {
      padding: 22px 26px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
      position: sticky; top: 0; background: var(--bg-card); z-index: 1;
    }
    .modal-body { padding: 22px 26px; }
    .modal-footer {
      padding: 18px 26px 22px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end;
      position: sticky; bottom: 0; background: var(--bg-card); z-index: 1;
    }
    .close-btn {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; flex-shrink: 0;
    }
    .close-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── TOAST ── */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 16px; min-width: 270px; display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-md); animation: toastIn .3s ease;
    }
    .toast.t-success { border-left: 4px solid var(--success); }
    .toast.t-error   { border-left: 4px solid var(--danger); }
    .toast.t-info    { border-left: 4px solid var(--info); }
    @keyframes toastIn { from{transform:translateX(80px);opacity:0} to{transform:translateX(0);opacity:1} }
    .toast-title { font-size: 13px; font-weight: 600; }
    .toast-msg   { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    @media(max-width:768px) {
      .sidebar { transform:translateX(-100%); }
      .sidebar.open { transform:translateX(0); }
      .main { margin-left:0; }
      .hamburger { display:flex; }
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .product-grid { grid-template-columns: 1fr; }
      .dash-cols { grid-template-columns: 1fr !important; }
      .cat-filters { flex-direction: column; align-items: stretch; }
    }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }
  </style>
</head>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// GATE DE SESIÓN — toda la app requiere login primero
// ══════════════════════════════════════════════════════
/* login.html ya validó el traspaso/token contra el backend y guardó
   authorized_modules — acá solo se confirma que incluya COMERCIAL antes
   de renderizar nada (defensa adicional; el backend igual rechaza con
   403 cualquier llamada a /api/comercial/* si no corresponde). */
(function requireSession() {
  const token = localStorage.getItem('qc_token');
  if (!token) { window.location.href = 'login.html'; return; }
  try {
    const storedUser = JSON.parse(localStorage.getItem('qc_user') || 'null');
    if (!(storedUser?.authorized_modules || []).includes('COMERCIAL')) {
      localStorage.removeItem('qc_token');
      localStorage.removeItem('qc_user');
      window.location.href = 'login.html';
    }
  } catch (_) {
    localStorage.removeItem('qc_token');
    localStorage.removeItem('qc_user');
    window.location.href = 'login.html';
  }
})();

// ══════════════════════════════════════════════════════
// API — consume la API centralizada QUBIRA (carpeta API/)
// ══════════════════════════════════════════════════════
const QC_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';
const QC_ALERT_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:5515/session-alert.html'
  : 'https://qubira-login.vercel.app/session-alert.html';
const CENTRAL_MODULO_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:5515/modulo.html'
  : 'https://qubira-login.vercel.app/modulo.html';

let qcToken = localStorage.getItem('qc_token') || null;
let qcUser  = JSON.parse(localStorage.getItem('qc_user') || 'null');

async function qcApiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (qcToken) headers.Authorization = 'Bearer ' + qcToken;

  const res = await fetch(QC_API_BASE + path, { ...opts, headers });

  if (res.status === 401) {
    const data401 = await res.json().catch(() => ({}));
    const cachedUsername = qcUser?.username;
    qcClearSession();
    if (data401?.code === 'SESSION_REPLACED') {
      window.location.href = `${QC_ALERT_URL}?username=${encodeURIComponent(cachedUsername || '')}&ip=${encodeURIComponent(data401.ip || '')}`;
    } else {
      goToLogin();
    }
    throw new Error('SESSION_EXPIRED');
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
  return data;
}

function qcClearSession() {
  qcToken = null;
  qcUser  = null;
  localStorage.removeItem('qc_token');
  localStorage.removeItem('qc_user');
}

function goToLogin(next) {
  window.location.href = 'login.html' + (next ? ('?next=' + encodeURIComponent(next)) : '');
}

async function logout() {
  try { await qcApiFetch('/api/auth/logout', { method: 'POST' }); } catch (err) { /* ya estaba vencido, igual cerramos local */ }
  qcClearSession();
  window.location.href = 'login.html';
}

function renderSidebarSession() {
  const avatarEl = document.getElementById('sf-avatar');
  const nameEl   = document.getElementById('sf-name');
  const roleEl   = document.getElementById('sf-role');
  if (!qcUser) { avatarEl.textContent = '–'; nameEl.textContent = '—'; roleEl.textContent = '—'; return; }
  const nombre = `${qcUser.nombre || ''} ${qcUser.apellidos || ''}`.trim() || qcUser.username;
  const iniciales = (qcUser.nombre?.[0] || qcUser.username?.[0] || '?').toUpperCase() + (qcUser.apellidos?.[0] || '').toUpperCase();
  avatarEl.textContent = iniciales;
  nameEl.textContent = nombre;
  roleEl.textContent = `${qcUser.rol || 'Comercial'} · Qubira`;
}

// ══════════════════════════════════════════════════════
// SIDEBAR MÓVIL / NAVEGACIÓN
// ══════════════════════════════════════════════════════
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mob-overlay').classList.toggle('show'); }
function closeSidebar()  { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mob-overlay').classList.remove('show'); }

const PAGE_META = {
  dashboard: { title:'Dashboard', sub:'Resumen de los productos disponibles para venta o alquiler' },
  calendario: { title:'Calendario', sub:'Reuniones de Comercial e interconexión con otras áreas' },
  catalogo:  { title:'Catálogo de Productos', sub:'Productos que ADG habilitó para que Comercial los ofrezca' },
};

function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('page-title').textContent = PAGE_META[page]?.title || page;
  document.getElementById('page-sub').textContent   = PAGE_META[page]?.sub   || '';
  document.querySelectorAll('.nav-item[data-page]').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  if (page === 'dashboard') renderDashboard();
  if (page === 'calendario') calRender();
  if (page === 'catalogo')  renderCatalogo();
  closeSidebar();
}

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
function toast(type, title, msg) {
  const w = document.getElementById('toast-wrap');
  const d = document.createElement('div');
  d.className = `toast t-${type}`;
  const iMap = { success:'check-circle', error:'x-circle', info:'info' };
  const cMap = { success:'var(--success)',  error:'var(--danger)',   info:'var(--info)'    };
  d.innerHTML = `
    <svg class="icon" style="width:20px;height:20px;color:${cMap[type]||'var(--info)'}"><use href="#icon-${iMap[type]||'bell'}"></use></svg>
    <div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
  w.appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

// ══════════════════════════════════════════════════════
// DATOS — catálogo de productos (ti.projects filtrados por ADG)
// ══════════════════════════════════════════════════════
const STATUS_LABEL = { pending:'Pendiente', active:'Activo', paused:'Pausado', finished_by_ti:'Finalizado (por revisar)', completed:'Completado', cancelled:'Cancelado' };
const TYPE_LABEL = { web:'Web', mobile:'Aplicativo Móvil', desktop:'Aplicativo de Escritorio' };
const OFFER_LABEL = { venta:'Venta', alquiler:'Alquiler', venta_alquiler:'Venta o alquiler' };
const CURRENCY_SYMBOL = { PEN:'S/', USD:'$', EUR:'€' };

let _products = [];
let _loaded = false;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function ensureProducts() {
  if (_loaded) return _products;
  try {
    const data = await qcApiFetch('/api/comercial/products');
    _products = data.products || [];
    _loaded = true;
  } catch (err) {
    if (err.message !== 'SESSION_EXPIRED') console.error(err);
  }
  return _products;
}

function productCardHtml(p) {
  const logo = p.company_logo
    ? `<img class="product-logo" src="${esc(p.company_logo)}" alt="">`
    : `<div class="product-logo-ph"><svg class="icon"><use href="#icon-package"></use></svg></div>`;
  const badges = [
    `<span class="badge b-${esc(p.status)}">${esc(STATUS_LABEL[p.status] || p.status)}</span>`,
    p.project_type ? `<span class="badge b-${esc(p.project_type)}">${esc(TYPE_LABEL[p.project_type] || p.project_type)}</span>` : '',
    p.family ? `<span class="badge b-family"><svg class="icon" style="width:11px;height:11px"><use href="#icon-layers"></use></svg> ${esc(p.family)}</span>` : '',
    p.commercial_offer_type ? `<span class="badge b-${esc(p.commercial_offer_type)}">${esc(OFFER_LABEL[p.commercial_offer_type] || p.commercial_offer_type)}</span>` : '',
  ].filter(Boolean).join('');
  const progress = Number(p.progress) || 0;
  /* ADG habilita el producto para Comercial apenas lo marca visible —
     no espera a que OPP fije el precio. Así que un producto puede
     aparecer en el catálogo sin precio todavía: se marca en rojo para
     que quede claro que es un estado transitorio (pendiente de OPP),
     no un error ni un "a consultar" permanente. */
  const hasVenta = p.commercial_price != null && p.commercial_price !== '';
  const hasAlquiler = p.rental_price != null && p.rental_price !== '';
  const hasPrice = hasVenta || hasAlquiler;
  const sym = CURRENCY_SYMBOL[p.commercial_price_currency] || 'S/';
  let price;
  if (hasVenta && hasAlquiler) {
    price = `<span class="product-price">${sym} ${Number(p.commercial_price).toLocaleString()}</span> <span style="font-size:12px;color:var(--text-muted)">o ${sym} ${Number(p.rental_price).toLocaleString()}/mes</span>`;
  } else if (hasVenta) {
    price = `<span class="product-price">${sym} ${Number(p.commercial_price).toLocaleString()}</span>`;
  } else if (hasAlquiler) {
    price = `<span class="product-price">${sym} ${Number(p.rental_price).toLocaleString()}<span style="font-size:12px;font-weight:600"> /mes</span></span>`;
  } else {
    price = `<span style="display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:#dc2626"><svg class="icon" style="width:14px;height:14px"><use href="#icon-alert-triangle"></use></svg> Precio pendiente de OPP</span>`;
  }
  return `
    <div class="product-card" style="${!hasPrice ? 'border-left:3px solid #dc2626' : ''}">
      <div class="product-head">
        ${logo}
        <div style="min-width:0">
          <div class="product-name">${esc(p.name)}</div>
          <div class="product-code">${esc(p.code)}</div>
        </div>
      </div>
      <div class="product-price-row">${price}</div>
      ${p.description ? `<div class="product-desc">${esc(p.description)}</div>` : ''}
      <div class="product-badges">${badges}</div>
      <div class="progress-wrap">
        <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">Avance</span>
        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${progress}%"></div></div>
        <span class="progress-pct">${progress}%</span>
      </div>
      ${p.commercial_notes ? `<div class="product-notes"><svg class="icon" style="width:13px;height:13px"><use href="#icon-info"></use></svg> ${esc(p.commercial_notes)}</div>` : ''}
    </div>`;
}

function emptyStateHtml(msg) {
  return `<div class="empty-state"><svg class="icon"><use href="#icon-inbox"></use></svg><div>${esc(msg)}</div></div>`;
}

let _catFilters = { search: '', offer: '', type: '' };

function catFilterChange() {
  _catFilters.search = document.getElementById('cat-f-search').value.trim().toLowerCase();
  _catFilters.offer = document.getElementById('cat-f-offer').value;
  _catFilters.type = document.getElementById('cat-f-type').value;
  renderCatalogoList();
}

function applyCatFilters(products) {
  return products.filter(p => {
    if (_catFilters.search) {
      const q = _catFilters.search;
      if (!(p.name || '').toLowerCase().includes(q) && !(p.code || '').toLowerCase().includes(q)) return false;
    }
    if (_catFilters.offer && p.commercial_offer_type !== _catFilters.offer) return false;
    if (_catFilters.type && p.project_type !== _catFilters.type) return false;
    return true;
  });
}

function renderCatalogoList() {
  const el = document.getElementById('catalogo-content');
  const filtered = applyCatFilters(_products);
  el.innerHTML = filtered.length
    ? `<div class="product-grid">${filtered.map(productCardHtml).join('')}</div>`
    : emptyStateHtml(_products.length ? 'Ningún producto coincide con el filtro.' : 'ADG todavía no habilitó ningún producto para Comercial.');
}

async function renderCatalogo() {
  const el = document.getElementById('catalogo-content');
  el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted)">Cargando…</div>`;
  await ensureProducts();
  renderCatalogoList();
}

const GREETING_DAY = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const GREETING_MONTH = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function renderGreeting() {
  const nombre = qcUser?.nombre || qcUser?.username || '';
  document.getElementById('greeting-title').textContent = `Bienvenido${nombre ? ', ' + nombre : ''} 👋`;
  const now = new Date();
  const dayName = GREETING_DAY[now.getDay()];
  document.getElementById('greeting-date').textContent = `${dayName[0].toUpperCase()}${dayName.slice(1)}, ${now.getDate()} de ${GREETING_MONTH[now.getMonth()]} de ${now.getFullYear()}`;
}

async function renderDashboard() {
  renderGreeting();
  const statsEl = document.getElementById('stats-grid');
  statsEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-muted);grid-column:1/-1">Cargando…</div>`;
  const products = await ensureProducts();

  const total = products.length;
  const enVenta = products.filter(p => p.commercial_offer_type === 'venta').length;
  const enAlquiler = products.filter(p => p.commercial_offer_type === 'alquiler').length;
  const ambos = products.filter(p => p.commercial_offer_type === 'venta_alquiler').length;
  const avgProgress = total ? Math.round(products.reduce((s, p) => s + (Number(p.progress) || 0), 0) / total) : 0;

  const stats = [
    { icon:'package', color:'var(--primary)', bg:'rgba(15,118,110,.12)', num:total, label:'Productos disponibles' },
    { icon:'tag', color:'var(--primary)', bg:'rgba(15,118,110,.12)', num:enVenta, label:'En venta' },
    { icon:'key', color:'var(--warning)', bg:'rgba(245,158,11,.12)', num:enAlquiler, label:'En alquiler' },
    { icon:'repeat', color:'var(--info)', bg:'rgba(59,130,246,.12)', num:ambos, label:'Venta o alquiler' },
    { icon:'trending-up', color:'var(--success)', bg:'rgba(5,150,105,.12)', num:avgProgress + '%', label:'Avance promedio' },
  ];
  statsEl.innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${s.bg};color:${s.color}"><svg class="icon"><use href="#icon-${s.icon}"></use></svg></div>
      <div class="stat-info"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>
    </div>`).join('');

  const previewEl = document.getElementById('dashboard-preview');
  const preview = products.slice(0, 3);
  previewEl.innerHTML = preview.length
    ? `<div class="product-grid">${preview.map(productCardHtml).join('')}</div>`

  renderDashboardAgenda();
}

    const params = new URLSearchParams({ mine: 'true', date_from: calIsoDate(today), date_to: calIsoDate(to) });
    const meetings = (await qcApiFetch('/api/calendar/meetings?' + params.toString()))
      .filter(m => m.status !== 'cancelled')
      .sort((a, b) => (a.meeting_date + a.start_time).localeCompare(b.meeting_date + b.start_time))

// ══════════════════════════════════════════════════════
// CALENDARIO CORPORATIVO — reuniones compartidas entre RR.HH., ADG,
// TI, Soporte, DST y Comercial (API/src/routes/calendar.js). Todo
// prefijado "cal" para no chocar con nombres ya usados en este archivo.
// ══════════════════════════════════════════════════════
const CAL_OWN_AREA = 'COMERCIAL';
const CAL_AREAS = [['COMERCIAL','Comercial'],['ADG','ADG'],['TI','OTI'],['RRHH','RR. HH.'],['SOPORTE','Soporte']];
const CAL_MEETING_TYPES = ['Reunión con cliente','Negociación','Presentación de producto','Seguimiento','Coordinación con otra área','Otro'];
const CAL_EXTERNAL_KINDS = [['cliente','Cliente'],['postulante','Postulante'],['proveedor','Proveedor'],['consultor','Consultor'],['otro','Otro']];
const CAL_STATUS_LABEL = { scheduled:'Programada', confirmed:'Confirmada', in_progress:'En curso', completed:'Finalizada', cancelled:'Cancelada' };
const CAL_MODALITY_LABEL = { presencial: 'Presencial', virtual: 'Virtual' };

/* Icono clickeable que resume la modalidad de la reunión: si es
   presencial abre la dirección en Google Maps, si es virtual abre el
   link de ingreso tal cual se guardó. Sin ubicación cargada, el ícono
   queda sin acción (solo informa la modalidad). */
function calModalityIconHtml(m, size) {
  const isVirtual = m.modality === 'virtual';
  const iconName = isVirtual ? 'video' : 'map-pin';
  const title = `${CAL_MODALITY_LABEL[m.modality] || 'Presencial'}${m.location ? ' · ' + m.location : ''}`;
  const sizeStyle = size ? `width:${size}px;height:${size}px` : '';
  if (!m.location) {
    return `<span class="badge" style="background:${isVirtual ? 'rgba(59,130,246,.12)' : 'rgba(15,118,110,.12)'};color:${isVirtual ? 'var(--info)' : 'var(--primary)'}" title="${calEsc(title)}"><svg class="icon" style="${sizeStyle}"><use href="#icon-${iconName}"></use></svg> ${CAL_MODALITY_LABEL[m.modality] || 'Presencial'}</span>`;
  }
  const href = isVirtual
    ? (/^https?:\/\//i.test(m.location) ? m.location : 'https://' + m.location)
    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.location)}`;
  return `<a href="${calEsc(href)}" target="_blank" rel="noopener noreferrer" class="badge" style="background:${isVirtual ? 'rgba(59,130,246,.12)' : 'rgba(15,118,110,.12)'};color:${isVirtual ? 'var(--info)' : 'var(--primary)'};text-decoration:none;cursor:pointer" title="${calEsc(title)}" onclick="event.stopPropagation()"><svg class="icon" style="${sizeStyle}"><use href="#icon-${iconName}"></use></svg> ${CAL_MODALITY_LABEL[m.modality] || 'Presencial'}</a>`;
}
/* En la vista semana solo se muestran las reuniones propias (ver
   calLoad()), así que colorear por área no sirve para distinguirlas —
   casi siempre serían todas del mismo color. Se colorea por tipo de
   reunión en su lugar, que varía más seguido. */
const CAL_MEETING_TYPE_COLORS = {
  'Reunión con cliente': '#10b981',
  'Negociación': '#f59e0b',
  'Presentación de producto': '#0ea5e9',
  'Seguimiento': '#8b5cf6',
  'Coordinación con otra área': '#f43f5e',
  'Otro': '#64748b',
};
function calMeetingTypeColor(type) { return CAL_MEETING_TYPE_COLORS[type] || '#64748b'; }
const CAL_WEEK_START_HOUR = 7;
const CAL_WEEK_END_HOUR = 21;
const CAL_WEEK_ROW_H = 48; // px por hora
const CAL_WEEKDAY_LABELS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const CAL_MONTH_LABELS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let calMode = 'area';
let calFilters = { area: CAL_OWN_AREA, participant: '', type: '', date_from: calTodayISO(), date_to: '', status: '' };
let calMeetings = [];
let calEditingId = null;
let calConflicts = [];
let calSelectedParticipants = [];
let calExternalParticipants = [];
let calDirResults = [];
let calDirDebounce, calFilterDebounce;
let calCheckToken = 0;
let calPendingImage = null; // url subida en el modal, antes de guardar la reunión
let calWeekOffset = 0;      // semanas respecto a la actual, para la vista semanal

function calTodayISO() { return new Date().toISOString().slice(0, 10); }
function calEsc(s) { return esc(s); }
function calFullName(p) { return [p.nombre, p.apellidos].filter(Boolean).join(' '); }
function calIsPrivileged() { return (qcUser?.nivel_acceso || 0) >= 100; }
function calIsoDate(d) { return d.toISOString().slice(0, 10); }
function calWeekBounds(offset) {
  const now = new Date();
  const day = now.getDay(); // 0=domingo..6=sábado
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  monday.setDate(monday.getDate() + diffToMonday + offset * 7);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
  return { monday, sunday: days[6], days };
}
/* Reparte eventos que se solapan en el tiempo en columnas lado a lado
   (como Google Calendar), para que nunca se dibujen uno encima del
   otro. Agrupa eventos en "racimos" de solapamiento consecutivo y
   dentro de cada racimo asigna la primera columna libre a cada evento
   (algoritmo greedy por orden de inicio). */
function calLayoutDayEvents(events) {
  const sorted = [...events].sort((a, b) => a.startMin - b.startMin || a.endMin - b.endMin);
  const placed = [];
  let cluster = [];
  let clusterEnd = -Infinity;

  const flushCluster = () => {
    if (!cluster.length) return;
    const colEnds = [];
    cluster.forEach(ev => {
      let col = colEnds.findIndex(end => end <= ev.startMin);
      if (col === -1) { col = colEnds.length; colEnds.push(ev.endMin); }
      else { colEnds[col] = ev.endMin; }
      placed.push({ ev, col });
    });
    const totalCols = colEnds.length;
    placed.slice(-cluster.length).forEach(p => { p.totalCols = totalCols; });
    cluster = []; clusterEnd = -Infinity;
  };

  sorted.forEach(ev => {
    if (cluster.length && ev.startMin >= clusterEnd) flushCluster();
    cluster.push(ev);
    clusterEnd = Math.max(clusterEnd, ev.endMin);
  });
  flushCluster();

  return placed;
}

async function calRender() {
  document.getElementById('cal-tab-area').className = 'cal-tab ' + (calMode === 'area' ? 'active' : '');
  document.getElementById('cal-tab-mine').className = 'cal-tab ' + (calMode === 'mine' ? 'active' : '');
  document.getElementById('cal-tab-week').className = 'cal-tab ' + (calMode === 'week' ? 'active' : '');
  document.getElementById('cal-tab-weekarea').className = 'cal-tab ' + (calMode === 'weekArea' ? 'active' : '');

  const isWeekMode = calMode === 'week' || calMode === 'weekArea';
  document.getElementById('cal-filters').style.display = isWeekMode ? 'none' : '';
  document.getElementById('cal-list').style.display = isWeekMode ? 'none' : '';
  document.getElementById('cal-week-view').style.display = isWeekMode ? '' : 'none';
  document.getElementById('cal-f-area').style.display = calMode === 'area' ? '' : 'none';

  const areaSel = document.getElementById('cal-f-area');
  areaSel.innerHTML = CAL_AREAS.map(([k,l]) => `<option value="${k}" ${calFilters.area===k?'selected':''}>${l}</option>`).join('')
    + (calIsPrivileged() ? `<option value="ALL" ${calFilters.area==='ALL'?'selected':''}>Todas las áreas</option>` : '');
  const typeSel = document.getElementById('cal-f-type');
  typeSel.innerHTML = '<option value="">Todos los tipos</option>' + CAL_MEETING_TYPES.map(t => `<option value="${t}" ${calFilters.type===t?'selected':''}>${t}</option>`).join('');
  const statusSel = document.getElementById('cal-f-status');
  statusSel.innerHTML = '<option value="">Todos los estados</option>' + Object.entries(CAL_STATUS_LABEL).map(([k,l]) => `<option value="${k}" ${calFilters.status===k?'selected':''}>${l}</option>`).join('');
  document.getElementById('cal-f-participant').value = calFilters.participant;
  document.getElementById('cal-f-date-from').value = calFilters.date_from;
  document.getElementById('cal-f-date-to').value = calFilters.date_to;

  await calLoad();
}

function calSetMode(mode) {
  calMode = mode;
  if (mode === 'week' || mode === 'weekArea') calWeekOffset = 0;
  calRender();
}

function calFilterChange(key, value) {
  clearTimeout(calFilterDebounce);
  if (key === 'participant') {
    calFilterDebounce = setTimeout(() => { calFilters.participant = value; calLoad(); }, 300);
  } else {
    calFilters[key] = value;
    calLoad();
  }
}

async function calLoad() {
  try {
    let params;
    if (calMode === 'week' || calMode === 'weekArea') {
      const { monday, sunday } = calWeekBounds(calWeekOffset);
      params = new URLSearchParams({ date_from: calIsoDate(monday), date_to: calIsoDate(sunday) });
      if (calMode === 'week') {
        /* Solo las reuniones propias de quien está logueado — el horario
           de una misma persona nunca se solapa (ya se valida al crear/
           editar), así que esta vista nunca va a mostrar bloques
           superpuestos. */
        params.set('mine', 'true');
      } else {
        /* Vista semana general: todas las reuniones del área, de
           cualquier participante — estas sí pueden solaparse entre sí
           (dos personas distintas con reuniones a la misma hora), así
           que el render usa un layout de columnas para no superponerlas. */
        params.set('area', CAL_OWN_AREA);
      }
      const meetings = await qcApiFetch('/api/calendar/meetings?' + params.toString());
      calMeetings = meetings;
      calRenderWeekView();
      return;
    }

    params = new URLSearchParams();
    if (calFilters.date_from) params.set('date_from', calFilters.date_from);
    if (calFilters.date_to) params.set('date_to', calFilters.date_to);
    if (calFilters.status) params.set('status', calFilters.status);
    if (calMode === 'mine') params.set('mine', 'true');
    else params.set('area', calFilters.area);

    let meetings = await qcApiFetch('/api/calendar/meetings?' + params.toString());
    if (calFilters.participant) {
      const q = calFilters.participant.toLowerCase();
      meetings = meetings.filter(m => (m.participants || []).some(p => (p.user_name || p.external_name || '').toLowerCase().includes(q)));
    }
    if (calFilters.type) meetings = meetings.filter(m => (m.meeting_type || '').toLowerCase() === calFilters.type.toLowerCase());
    calMeetings = meetings;
    calRenderList();
  } catch (err) {
    document.getElementById('cal-list').innerHTML = `<div class="card" style="padding:24px;text-align:center;color:var(--text-muted)">${calEsc(err.message || 'Error al cargar el calendario')}</div>`;
  }
}

function calRenderWeekView() {
  const general = calMode === 'weekArea';
  const { monday, days } = calWeekBounds(calWeekOffset);
  const hours = [];
  for (let h = CAL_WEEK_START_HOUR; h < CAL_WEEK_END_HOUR; h++) hours.push(h);
  const rangeLabel = `${monday.getDate()} de ${CAL_MONTH_LABELS[monday.getMonth()]}${monday.getMonth() !== days[6].getMonth() ? ' – ' + days[6].getDate() + ' de ' + CAL_MONTH_LABELS[days[6].getMonth()] : ' – ' + days[6].getDate()} de ${days[6].getFullYear()}`;
  const todayIso = calTodayISO();

  const dayCols = days.map((d) => {
    const iso = calIsoDate(d);
    const isToday = iso === todayIso;
    const dayMeetings = calMeetings
      .filter(m => m.meeting_date === iso && m.visibility !== 'busy_only')
      .map(m => {
        const [sh, sm] = m.start_time.slice(0,5).split(':').map(Number);
        const [eh, em] = m.end_time.slice(0,5).split(':').map(Number);
        return {
          m,
          startMin: Math.max(0, (sh - CAL_WEEK_START_HOUR) * 60 + sm),
          endMin: Math.min((CAL_WEEK_END_HOUR - CAL_WEEK_START_HOUR) * 60, (eh - CAL_WEEK_START_HOUR) * 60 + em),
        };
      });
    const blocks = calLayoutDayEvents(dayMeetings).map(({ ev, col, totalCols }) => {
      const { m, startMin, endMin } = ev;
      const top = (startMin / 60) * CAL_WEEK_ROW_H;
      const height = Math.max(20, ((endMin - startMin) / 60) * CAL_WEEK_ROW_H);
      const widthPct = 100 / totalCols;
      const leftPct = col * widthPct;
      const posStyle = totalCols > 1
        ? `left:calc(${leftPct}% + 1px);width:calc(${widthPct}% - 2px)`
        : 'left:2px;right:2px';
      const internalNames = general
        ? (m.participants || []).filter(p => p.participant_type === 'internal').map(p => p.user_name).filter(Boolean)
        : [];
      return `
        <button type="button" class="cal-week-event" onclick="calViewMeeting('${m.id}')" style="position:absolute;border:0;border-radius:6px;background:${calMeetingTypeColor(m.meeting_type)};color:#fff;text-align:left;padding:3px 6px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25);top:${top}px;height:${height}px;${posStyle}">
          <div style="font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${calEsc(m.title)}</div>
          <div style="font-size:9px;opacity:.9;line-height:1.2">${m.start_time.slice(0,5)}–${m.end_time.slice(0,5)}</div>
          ${internalNames.length ? `<div style="font-size:9px;opacity:.85;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${calEsc(internalNames.join(', '))}</div>` : ''}
        </button>`;
    }).join('');
    return `
      <div style="position:relative;border-left:1px solid var(--border);${isToday ? 'background:rgba(15,118,110,.06)' : ''}height:${hours.length * CAL_WEEK_ROW_H}px">
        ${hours.map((_, hi) => `<div style="position:absolute;left:0;right:0;border-top:1px solid var(--border);top:${hi * CAL_WEEK_ROW_H}px"></div>`).join('')}
        ${blocks}
      </div>`;
  }).join('');

  const dayHeaders = days.map((d, i) => {
    const iso = calIsoDate(d);
    const isToday = iso === todayIso;
    return `
      <div style="text-align:center;padding:8px 0;border-left:1px solid var(--border);${isToday ? 'background:rgba(15,118,110,.06)' : ''}">
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase">${CAL_WEEKDAY_LABELS[i]}</div>
        <div style="font-size:13.5px;font-weight:700;${isToday ? 'color:var(--primary)' : ''}">${d.getDate()}</div>
      </div>`;
  }).join('');

  document.getElementById('cal-week-view').innerHTML = `
  <div class="card" style="padding:0;overflow:hidden;">
    ${general ? `<div style="padding:10px 14px 0;font-size:12px;font-weight:600;color:var(--text-muted);">Todas las reuniones del área Comercial — eventos que se cruzan en horario se muestran lado a lado</div>` : ''}
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);">
      <button type="button" class="btn btn-outline" style="padding:6px 12px;font-size:12.5px;" onclick="calWeekOffset=0;calLoad();">Hoy</button>
      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" style="border:0;background:none;cursor:pointer;color:var(--text-muted);padding:4px;" onclick="calWeekOffset--;calLoad();"><svg class="icon"><use href="#icon-chevron-left"></use></svg></button>
        <span style="font-size:13.5px;font-weight:600;">${rangeLabel}</span>
        <button type="button" style="border:0;background:none;cursor:pointer;color:var(--text-muted);padding:4px;" onclick="calWeekOffset++;calLoad();"><svg class="icon"><use href="#icon-chevron-right"></use></svg></button>
      </div>
      <div style="width:72px;"></div>
    </div>
    <div style="overflow-x:auto;">
      <div style="display:grid;grid-template-columns:56px repeat(7,minmax(110px,1fr));min-width:820px">
        <div></div>${dayHeaders}
        <div style="position:relative;height:${hours.length * CAL_WEEK_ROW_H}px">
          ${hours.map((h, hi) => `<div style="position:absolute;left:0;right:0;text-align:right;padding-right:8px;font-size:11px;color:var(--text-muted);transform:translateY(-50%);top:${hi * CAL_WEEK_ROW_H}px">${String(h).padStart(2,'0')}:00</div>`).join('')}
        </div>
        ${dayCols}
      </div>
    </div>
  </div>`;
}

function calRenderList() {
  const c = document.getElementById('cal-list');
  if (!calMeetings.length) {
    c.innerHTML = `<div class="card" style="padding:36px;text-align:center;color:var(--text-muted)"><svg class="icon" style="width:28px;height:28px;opacity:.4"><use href="#icon-calendar"></use></svg><p style="margin-top:10px">No hay reuniones en este rango</p></div>`;
    return;
  }
  const groups = {};
  calMeetings.forEach(m => { (groups[m.meeting_date] ||= []).push(m); });
  c.innerHTML = Object.entries(groups).map(([date, items]) => `
    <div style="margin-bottom:18px">
      <h4 style="font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">${calFmtDate(date)}</h4>
      <div style="display:flex;flex-direction:column;gap:8px">${items.map(calMeetingCard).join('')}</div>
    </div>`).join('');
}

function calFmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function calMeetingCard(m) {
  const isBusy = m.visibility === 'busy_only';
  const participantsHtml = (m.participants || []).map(p => p.participant_type === 'external'
    ? `${calEsc(p.external_name)} (${(CAL_EXTERNAL_KINDS.find(k=>k[0]===p.external_kind)||[])[1] || p.external_kind})`
    : `${calEsc(p.user_name || '—')}${p.user_area ? ' — ' + calEsc(p.user_area) : ''}${p.user_cargo ? ' — ' + calEsc(p.user_cargo) : ''}`).join('<br>');
  const statusTxt = m.status === 'cancelled' ? 'Cancelada' : m.status === 'completed' ? 'Finalizada' : 'Programada';
  return `
  <div class="card" style="padding:14px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <strong>${calEsc(m.title)}</strong>
          <span class="badge" style="background:rgba(15,118,110,.12);color:var(--primary)">${calEsc(m.area)}</span>
          <span class="badge" style="background:rgba(5,150,105,.14);color:var(--success)">${statusTxt}</span>
          ${calModalityIconHtml(m, 11)}
          ${isBusy ? '<span class="badge" style="background:rgba(107,114,128,.14);color:#9ca3af"><svg class="icon" style="width:11px;height:11px"><use href="#icon-lock"></use></svg> Privada</span>' : ''}
        </div>
        <p style="font-size:12.5px;color:var(--text-muted);margin-top:4px">${m.start_time.slice(0,5)} — ${m.end_time.slice(0,5)}${m.meeting_type ? ' · ' + calEsc(m.meeting_type) : ''}</p>
        ${!isBusy && m.motivo ? `<p style="font-size:13.5px;margin-top:6px">${calEsc(m.motivo)}</p>` : ''}
        ${!isBusy && participantsHtml ? `<div style="font-size:12.5px;color:var(--text-muted);margin-top:6px">${participantsHtml}</div>` : ''}
        ${isBusy ? '<p style="font-size:12.5px;color:var(--text-muted);margin-top:6px">Sin acceso al detalle de esta reunión</p>' : ''}
      </div>
      ${!isBusy ? `
      <div style="display:flex;gap:4px;flex-shrink:0">
        <button type="button" class="btn btn-outline btn-sm" onclick="calViewMeeting('${m.id}')" title="Ver detalle"><svg class="icon" style="width:14px;height:14px"><use href="#icon-eye"></use></svg></button>
        <button type="button" class="btn btn-outline btn-sm" onclick="calOpenForm('${m.id}')" title="Editar"><svg class="icon" style="width:14px;height:14px"><use href="#icon-edit-2"></use></svg></button>
        <button type="button" class="btn btn-outline btn-sm" onclick="calCancelMeeting('${m.id}')" title="Cancelar"><svg class="icon" style="width:14px;height:14px"><use href="#icon-slash"></use></svg></button>
        <button type="button" class="btn btn-outline btn-sm" onclick="calDeleteMeeting('${m.id}')" title="Eliminar"><svg class="icon" style="width:14px;height:14px"><use href="#icon-trash-2"></use></svg></button>
      </div>` : ''}
    </div>
  </div>`;
}

  const currentImage = calPendingImage !== null ? calPendingImage : (editing?.image_url || null);
  return `
    <div class="form-group" style="margin-bottom:12px">
      <label>Nombre de la reunión *</label>
      <input id="cal-in-title" autocomplete="off" value="${calEsc(editing?.title || '')}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="form-group"><label>Fecha *</label><input type="date" id="cal-in-date" value="${editing?.meeting_date || ''}"></div>
      <div class="form-group"><label>Inicio *</label><input type="time" id="cal-in-start" value="${editing ? editing.start_time.slice(0,5) : ''}"></div>
      <div class="form-group"><label>Fin *</label><input type="time" id="cal-in-end" value="${editing ? editing.end_time.slice(0,5) : ''}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="form-group">
        <label>Tipo de reunión</label>
        <select id="cal-in-type">
          <option value="">— Seleccionar —</option>
          ${CAL_MEETING_TYPES.map(t => `<option value="${t}" ${editing?.meeting_type===t?'selected':''}>${t}</option>`).join('')}

      </div>
      <div class="form-group">
        <label>Modalidad</label>
        <select id="cal-in-modality" onchange="calUpdateLocationField()">

          <option value="virtual" ${editing?.modality==='virtual'?'selected':''}>Virtual</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px"><label>Motivo</label><input id="cal-in-motivo" autocomplete="off" value="${calEsc(editing?.motivo || '')}"></div>
    <div class="form-group" style="margin-bottom:12px"><label>Descripción</label><textarea id="cal-in-description" rows="2">${calEsc(editing?.description || '')}</textarea></div>
    <div class="form-group" style="margin-bottom:12px">
      <label id="cal-in-location-label">${(editing?.modality||'presencial')==='virtual' ? 'Link de la reunión' : 'Dirección'}</label>
      <input id="cal-in-location" placeholder="${(editing?.modality||'presencial')==='virtual' ? 'Link de Zoom, Meet, Teams...' : 'Sala de reuniones, dirección...'}" autocomplete="off" value="${calEsc(editing?.location || '')}">
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label>Imagen del evento (opcional)</label>
      ${currentImage ? `
        <div style="position:relative;display:inline-block;margin-bottom:6px">

          <button type="button" onclick="calRemoveImage()" style="position:absolute;top:-6px;right:-6px;background:var(--bg-card);border-radius:50%;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.3);width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted)"><svg class="icon" style="width:11px;height:11px"><use href="#icon-x"></use></svg></button>
        </div>` : ''}
      <input type="file" id="cal-image-input" accept="image/*" onchange="calHandleImageUpload(this)" style="font-size:12.5px">
      <p id="cal-image-status" style="font-size:12px;color:var(--text-muted);margin-top:4px"></p>

      <label>Participantes internos</label>
      <div style="position:relative">
        <input id="cal-participant-search" placeholder="Buscar por nombre, cargo o área..." autocomplete="off" oninput="calSearchDirectory(this.value)">
        <div id="cal-dir-results" style="display:none;position:absolute;z-index:10;left:0;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);margin-top:4px;max-height:180px;overflow-y:auto"></div>
      </div>
      <div id="cal-selected-participants" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${calSelectedParticipantsHtml()}</div>

      <label>Participante externo (cliente, postulante, proveedor...)</label>

function calOpenForm(editId) {
  const editing = editId ? calMeetings.find(m => m.id === editId) : null;
  if (editId && (!editing || editing.visibility === 'busy_only')) return;
  calEditingId = editId || null;
  calConflicts = [];
  calPendingImage = null;
  if (editing) {
    calSelectedParticipants = (editing.participants || []).filter(p => p.participant_type === 'internal')
      .map(p => ({ user_id: p.user_id, nombre: p.user_name, area: p.user_area }));
    calExternalParticipants = (editing.participants || []).filter(p => p.participant_type === 'external')
      .map(p => ({ name: p.external_name, kind: p.external_kind }));
  } else {
    calSelectedParticipants = [];
    calExternalParticipants = [];
  }

  document.getElementById('cal-modal-kicker').textContent = editing ? 'Editar reunión' : 'Nueva reunión';
  document.getElementById('cal-modal-body').innerHTML = calFormBodyHtml(editing);
  document.getElementById('cal-save-btn').disabled = false;
  document.getElementById('cal-save-btn').style.display = '';
  document.getElementById('cal-modal').classList.add('open');

  ['cal-in-date','cal-in-start','cal-in-end','cal-in-modality'].forEach(id => {
    document.getElementById(id).addEventListener('change', calLiveCheck);
  });
}

function calCloseForm() { document.getElementById('cal-modal').classList.remove('open'); }

/* La Ubicación es el mismo campo para ambas modalidades, pero cambia
   de significado: en Presencial es una dirección física, en Virtual es
   el link de ingreso — solo se le cambia la etiqueta/placeholder. */
function calUpdateLocationField() {
  const modality = document.getElementById('cal-in-modality').value;
  const isVirtual = modality === 'virtual';
  document.getElementById('cal-in-location-label').textContent = isVirtual ? 'Link de la reunión' : 'Dirección';
  document.getElementById('cal-in-location').placeholder = isVirtual ? 'Link de Zoom, Meet, Teams...' : 'Sala de reuniones, dirección...';
}

/* Vuelve a pintar solo el cuerpo del modal (p. ej. tras subir o quitar
   la imagen), sin cerrar y reabrir el modal entero — así no se pierde
   el resto de lo que ya se había tecleado en el formulario. */
function calRerenderFormBody() {
  const editing = calEditingId ? calMeetings.find(m => m.id === calEditingId) : null;
  document.getElementById('cal-modal-body').innerHTML = calFormBodyHtml(editing);
  ['cal-in-date','cal-in-start','cal-in-end','cal-in-modality'].forEach(id => {
    document.getElementById(id).addEventListener('change', calLiveCheck);
  });
}

function calRemoveImage() {
  calPendingImage = null;
  calRerenderFormBody();
}

async function calUploadMeetingImage(file) {
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(QC_API_BASE + '/api/calendar/meetings/image', {
    method: 'POST',
    headers: qcToken ? { Authorization: 'Bearer ' + qcToken } : {},
    body: fd,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
  return data.url;
}

async function calHandleImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const status = document.getElementById('cal-image-status');
  if (status) status.textContent = 'Subiendo imagen...';
  try {
    calPendingImage = await calUploadMeetingImage(file);
    calRerenderFormBody();
    toast('success', 'Imagen subida', file.name);
  } catch (err) {
    if (status) status.textContent = '';
    toast('error', 'No se pudo subir la imagen', err.message || 'Error');
  }
}

function calSelectedParticipantsHtml() {
  if (!calSelectedParticipants.length) return '<p style="font-size:12px;color:var(--text-muted)">Sin participantes internos</p>';
  return calSelectedParticipants.map(p => `
    <span class="badge" style="display:inline-flex;align-items:center;gap:5px;background:rgba(15,118,110,.12);color:var(--primary)">
      ${calEsc(calFullName(p))}${p.area ? ' — ' + calEsc(p.area) : ''}
      <svg class="icon" style="width:12px;height:12px;cursor:pointer" onclick="calRemoveParticipant(${p.user_id})"><use href="#icon-x"></use></svg>
    </span>`).join('');
}
function calSelectedExternalsHtml() {
  if (!calExternalParticipants.length) return '';
  return calExternalParticipants.map((p, i) => `
    <span class="badge" style="display:inline-flex;align-items:center;gap:5px;background:rgba(245,158,11,.14);color:var(--warning)">
      ${calEsc(p.name)} (${(CAL_EXTERNAL_KINDS.find(k=>k[0]===p.kind)||[])[1] || p.kind})
      <svg class="icon" style="width:12px;height:12px;cursor:pointer" onclick="calRemoveExternal(${i})"><use href="#icon-x"></use></svg>
    </span>`).join('');
}
/* calConflicts trae conflictos "hard" (misma modalidad presencial,
   bloquean guardar) y "soft" (modalidad mixta — una presencial y otra
   virtual —, solo se avisa pero sí se puede guardar e inscribir a la
   persona en ambas). Se muestran en dos bloques separados. */
function calConflictBannerHtml() {
  if (!calConflicts.length) return '';
  const hard = calConflicts.filter(c => c.hard);
  const soft = calConflicts.filter(c => !c.hard);
  const item = c => `<li>${calEsc(c.user_name || 'Alguien')} (${calEsc(c.area || '—')}) ya tiene "${calEsc(c.meeting_name)}" (${CAL_MODALITY_LABEL[c.modality] || 'Presencial'}) de ${c.start_time.slice(0,5)} a ${c.end_time.slice(0,5)} (${c.date}).</li>`;
  return `
  ${hard.length ? `
  <div style="border-radius:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);padding:12px;font-size:13px;color:#dc2626;margin-top:4px">
    <p style="font-weight:700;display:flex;align-items:center;gap:6px"><svg class="icon" style="width:15px;height:15px"><use href="#icon-alert-triangle"></use></svg> ${hard.length > 1 ? 'Se encontraron ' + hard.length + ' conflictos de horario:' : 'Conflicto de horario'}</p>
    <ul style="margin:6px 0 0 18px;padding:0">${hard.map(item).join('')}</ul>
  </div>` : ''}
  ${soft.length ? `
  <div style="border-radius:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);padding:12px;font-size:13px;color:#b45309;margin-top:4px">
    <p style="font-weight:700;display:flex;align-items:center;gap:6px"><svg class="icon" style="width:15px;height:15px"><use href="#icon-alert-triangle"></use></svg> ${soft.length > 1 ? 'Hay ' + soft.length + ' cruces de horario (modalidad mixta)' : 'Hay un cruce de horario (modalidad mixta)'}</p>
    <ul style="margin:6px 0 0 18px;padding:0">${soft.map(item).join('')}</ul>
    <p style="margin-top:6px;font-size:12px">Al ser una presencial y una virtual, igual puedes guardar e inscribir a la persona en ambas.</p>
  </div>` : ''}`;
}

function calRemoveParticipant(id) {
  calSelectedParticipants = calSelectedParticipants.filter(p => p.user_id !== id);
  document.getElementById('cal-selected-participants').innerHTML = calSelectedParticipantsHtml();
  calLiveCheck();
}
function calRemoveExternal(i) {
  calExternalParticipants.splice(i, 1);
  document.getElementById('cal-selected-externals').innerHTML = calSelectedExternalsHtml();
}
function calAddExternal() {
  const nameEl = document.getElementById('cal-ext-name');
  const kindEl = document.getElementById('cal-ext-kind');
  const name = nameEl.value.trim();
  if (!name) return;
  calExternalParticipants.push({ name, kind: kindEl.value });
  nameEl.value = '';
  document.getElementById('cal-selected-externals').innerHTML = calSelectedExternalsHtml();
}

function calSearchDirectory(q) {
  clearTimeout(calDirDebounce);
  const results = document.getElementById('cal-dir-results');
  q = q.trim();
  if (!q) { results.style.display = 'none'; results.innerHTML = ''; return; }
  calDirDebounce = setTimeout(async () => {
    try {
      calDirResults = await qcApiFetch('/api/calendar/directory?q=' + encodeURIComponent(q));
      results.innerHTML = calDirResults.length
        ? calDirResults.map(p => `
            <div onclick="calPickParticipant('${p.user_id}')" style="display:flex;justify-content:space-between;padding:8px 12px;cursor:pointer;font-size:13.5px" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
              <span>${calEsc(calFullName(p))}</span>
              <span style="color:var(--text-muted)">${calEsc(p.area || '—')}${p.cargo ? ' · ' + calEsc(p.cargo) : ''}</span>
            </div>`).join('')
        : '<div style="padding:8px 12px;color:var(--text-muted);font-size:12.5px">Sin resultados</div>';
      results.style.display = 'block';
    } catch { /* silencioso */ }
  }, 250);
}

function calPickParticipant(idStr) {
  const id = Number(idStr);
  const person = calDirResults.find(p => Number(p.user_id) === id);
  const results = document.getElementById('cal-dir-results');
  if (person && !calSelectedParticipants.some(p => p.user_id === person.user_id)) {
    calSelectedParticipants.push(person);
    document.getElementById('cal-selected-participants').innerHTML = calSelectedParticipantsHtml();
    calLiveCheck();
  }
  document.getElementById('cal-participant-search').value = '';
  results.style.display = 'none'; results.innerHTML = '';
}

async function calLiveCheck() {
  const date = document.getElementById('cal-in-date').value;
  const start = document.getElementById('cal-in-start').value;
  const end = document.getElementById('cal-in-end').value;
  const modality = document.getElementById('cal-in-modality')?.value || 'presencial';
  const ids = calSelectedParticipants.map(p => p.user_id);
  const saveBtn = document.getElementById('cal-save-btn');

  if (!date || !start || !end || !ids.length || end <= start) {
    calConflicts = [];
    document.getElementById('cal-conflict-banner').innerHTML = '';
    saveBtn.disabled = false;
    return;
  }

  const token = ++calCheckToken;
  let conflicts = [];
  try {
    const res = await qcApiFetch('/api/calendar/check-availability', {
      method: 'POST', body: JSON.stringify({ date, start_time: start, end_time: end, participant_ids: ids, exclude_meeting_id: calEditingId || undefined, modality }),
    });
    conflicts = res.conflicts || [];
  } catch { conflicts = []; }
  if (token !== calCheckToken) return;
  calConflicts = conflicts;
  document.getElementById('cal-conflict-banner').innerHTML = calConflictBannerHtml();
  // Solo los conflictos "hard" (misma modalidad presencial) bloquean
  // guardar — los "soft" (modalidad mixta) solo avisan.
  saveBtn.disabled = calConflicts.some(c => c.hard);
}

async function calSubmitForm() {
  const title = document.getElementById('cal-in-title').value.trim();
  const date = document.getElementById('cal-in-date').value;
  const start_time = document.getElementById('cal-in-start').value;
  const end_time = document.getElementById('cal-in-end').value;
  const meeting_type = document.getElementById('cal-in-type').value;
  const modality = document.getElementById('cal-in-modality').value;
  const location = document.getElementById('cal-in-location').value.trim();
  const motivo = document.getElementById('cal-in-motivo').value.trim();
  const description = document.getElementById('cal-in-description').value.trim();

  if (!title) return toast('error', 'Falta información', 'El nombre de la reunión es requerido');
  if (!date || !start_time || !end_time) return toast('error', 'Falta información', 'Fecha y horario son requeridos');
  if (end_time <= start_time) return toast('error', 'Horario inválido', 'La hora de fin debe ser posterior a la de inicio');
  if (!calSelectedParticipants.length && !calExternalParticipants.length) return toast('error', 'Falta información', 'Selecciona al menos un participante');

  const editing = calEditingId ? calMeetings.find(m => m.id === calEditingId) : null;
  const image_url = calPendingImage !== null ? calPendingImage : (editing?.image_url || null);

  const payload = {
    title, date, start_time, end_time, meeting_type, modality, location, motivo, description, image_url,
    participants: calSelectedParticipants.map(p => ({ user_id: p.user_id })),
    external_participants: calExternalParticipants,
  };

  try {
    if (calEditingId) {
      await qcApiFetch(`/api/calendar/meetings/${calEditingId}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('success', 'Reunión actualizada', title);
    } else {
      await qcApiFetch('/api/calendar/meetings', { method: 'POST', body: JSON.stringify(payload) });
      toast('success', 'Reunión programada', title);
    }
    calCloseForm();
    await calLoad();
  } catch (err) {
    toast('error', 'No se pudo guardar', err.message || 'Error');
  }
}

async function calCancelMeeting(id) {
  const m = calMeetings.find(x => x.id === id);
  if (!m || !confirm(`¿Deseas cancelar la reunión "${m.title}"? Se liberará el horario de los participantes.`)) return;
  try {
    await qcApiFetch(`/api/calendar/meetings/${id}/cancel`, { method: 'POST' });
    toast('success', 'Reunión cancelada', m.title);
    await calLoad();
  } catch (err) { toast('error', 'Error', err.message || 'Error'); }
}

async function calDeleteMeeting(id) {
  const m = calMeetings.find(x => x.id === id);
  if (!m || !confirm(`¿Deseas eliminar la reunión "${m.title}"? Esta acción no se puede deshacer.`)) return;
  try {
    await qcApiFetch(`/api/calendar/meetings/${id}`, { method: 'DELETE' });
    toast('success', 'Reunión eliminada', m.title);
    await calLoad();
  } catch (err) { toast('error', 'Error', err.message || 'Error'); }
}

function calViewMeeting(id) {
  const m = calMeetings.find(x => x.id === id);
  if (!m || m.visibility === 'busy_only') return;
  const participantsHtml = (m.participants || []).map(p => p.participant_type === 'external'
    ? `<li>${calEsc(p.external_name)} — ${(CAL_EXTERNAL_KINDS.find(k=>k[0]===p.external_kind)||[])[1] || p.external_kind} (externo)</li>`
    : `<li>${calEsc(p.user_name || '—')}${p.user_area ? ' — ' + calEsc(p.user_area) : ''}${p.user_cargo ? ' — ' + calEsc(p.user_cargo) : ''}</li>`).join('');
  document.getElementById('cal-modal-kicker').textContent = m.area + ' · ' + m.meeting_date;
  document.getElementById('cal-modal-body').innerHTML = `
    <div style="font-size:13.5px;display:flex;flex-direction:column;gap:8px">
      ${m.image_url ? `<img src="${calEsc(m.image_url)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">` : ''}
      <p style="font-size:16px;font-weight:700">${calEsc(m.title)}</p>
      <p>${calModalityIconHtml(m)}</p>
      <p><strong>Horario:</strong> ${m.start_time.slice(0,5)} — ${m.end_time.slice(0,5)}</p>
      ${m.meeting_type ? `<p><strong>Tipo:</strong> ${calEsc(m.meeting_type)}</p>` : ''}
      ${m.location ? `<p><strong>${m.modality === 'virtual' ? 'Link' : 'Dirección'}:</strong> ${calEsc(m.location)}</p>` : ''}
      ${m.motivo ? `<p><strong>Motivo:</strong> ${calEsc(m.motivo)}</p>` : ''}
      ${m.description ? `<div><strong>Descripción:</strong><p style="margin-top:4px;white-space:pre-wrap">${calEsc(m.description)}</p></div>` : ''}
      <div><strong>Participantes:</strong><ul style="margin:4px 0 0 18px;padding:0">${participantsHtml || '<li>Sin participantes</li>'}</ul></div>
      <p style="color:var(--text-muted)">Programada por ${calEsc(m.created_by_name || '—')}</p>
    </div>`;
  document.getElementById('cal-save-btn').style.display = 'none';
  document.getElementById('cal-modal').classList.add('open');
}

// ─── Cierre de sesión por inactividad + detección de sesión reemplazada ──────
(function setupSessionGuard(onLogout) {
  const WARN_AFTER_MS = 90 * 1000;
  const LOGOUT_AFTER_MS = 120 * 1000;
  const HEARTBEAT_MS = 20 * 1000;

  let lastActivity = Date.now();
  let overlay = null;
  let countdownInterval = null;
  let lastHeartbeatAt = 0;

  function hideWarning() { if (overlay) { overlay.remove(); overlay = null; } clearInterval(countdownInterval); }

  function showWarning() {
    if (overlay) return;
    let secondsLeft = Math.round((LOGOUT_AFTER_MS - WARN_AFTER_MS) / 1000);
    overlay = document.createElement('div');
    overlay.id = 'inactivity-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:28px;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)">
        <div style="width:48px;height:48px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px">⏱</div>
        <h3 style="font-size:16px;font-weight:800;margin:0 0 8px;color:#111827">¿Sigues ahí?</h3>
        <p style="font-size:13px;color:#6b7280;margin:0 0 18px;line-height:1.5">Tu sesión se cerrará por inactividad en <strong id="inactivity-countdown">${secondsLeft}</strong> segundos.</p>
        <button id="inactivity-stay-btn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">Seguir conectado</button>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('inactivity-stay-btn').addEventListener('click', () => { lastActivity = Date.now(); hideWarning(); });
    countdownInterval = setInterval(() => {
      secondsLeft -= 1;
      const el = document.getElementById('inactivity-countdown');
      if (el) el.textContent = String(Math.max(secondsLeft, 0));
      if (secondsLeft <= 0) clearInterval(countdownInterval);
    }, 1000);
  }

  function handleActivity() { lastActivity = Date.now(); hideWarning(); }
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt =>
    document.addEventListener(evt, handleActivity, { passive: true }));

  async function heartbeat() {
    if (!localStorage.getItem('qc_token')) return;
    try { await qcApiFetch('/api/auth/me'); } catch (_) { /* ya lo maneja qcApiFetch */ }
  }

  function tick() {
    if (!localStorage.getItem('qc_token')) return;
    const elapsed = Date.now() - lastActivity;
    if (elapsed >= LOGOUT_AFTER_MS) { hideWarning(); onLogout(); return; }
    if (elapsed >= WARN_AFTER_MS) showWarning();

    const now = Date.now();
    if (now - lastHeartbeatAt >= HEARTBEAT_MS) { lastHeartbeatAt = now; heartbeat(); }
  }

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  tick();
})(logout);
</script>
</body>
</html>
